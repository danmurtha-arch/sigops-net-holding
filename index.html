<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>sigops.net</title>
<link rel="canonical" href="https://sigops.net/">
<style>
  :root { --ink: #1c1c1c; --muted: #5d5d5d; --accent: #1f3a5f; --paper: #f4f1ea; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece9e2; --muted: #a7a39a; --accent: #9db8dd; --paper: #161616; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--paper); line-height: 1.55; }
  main { max-width: 640px; margin: 0 auto; padding: 12vh 24px 8vh; }
  h1 { font-size: 2rem; letter-spacing: -0.01em; margin: 0 0 12px; overflow-wrap: anywhere; }
  p { font-size: 1.05rem; margin: 0 0 18px; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
</style>
</head>
<body>
<main>
  <h1>sigops.net</h1>
  <p>Site in preparation.</p>
  <p><a href="mailto:dan.murtha@sigops.net">dan.murtha@sigops.net</a></p>
  <p class="meta">Build 2026-10-18</p>
</main>
</body>
</html>
